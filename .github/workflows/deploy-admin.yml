name: Deploy Web Admin Panel

# Sirf Admin Panel ke web build ko Firebase Hosting par deploy karti hai.
# Mobile APK (build-apk.yml) se bilkul alag hai — is mein Admin code hota
# hai, mobile build mein nahi.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy-admin:
    name: Build & Deploy Admin Panel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Create .env file
        run: |
          cat <<EOF > .env.local
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          APP_URL=${{ secrets.APP_URL }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          EOF

      # Admin-only bundle -> "dist-admin" folder. Mobile UI code is excluded
      # entirely from this build.
      - name: Build admin web app
        run: bun run build:admin

      # Requires a "FIREBASE_SERVICE_ACCOUNT" repository secret (a Firebase
      # service account JSON key with Hosting Admin permission). See
      # GITHUB_ACTIONS_SETUP.md for how to generate and add it.
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          projectId: halqa-e-usmania-official
          channelId: live
